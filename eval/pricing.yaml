# Verified from Anthropic's first-party pricing table, standard global API rates.
# Subscription-auth costs are estimates, not bills. Cache write is the 5m rate.
claude-sonnet-5-5:
  input_per_mtok: 2
  output_per_mtok: 10
  cache_write_per_mtok: 2.5
  cache_write_1h_per_mtok: 4
  cache_read_per_mtok: 0.1
  source_url: https://platform.claude.com/docs/en/about-claude/pricing
  verified_on: "2026-10-22"
claude-haiku-5-5:
  input_per_mtok: 0.1
  output_per_mtok: 0.5
  cache_write_per_mtok: 0.125
  cache_write_1h_per_mtok: 0.2
  cache_read_per_mtok: 0.01
  long_context_threshold: 100000
  long_context:
    input_per_mtok: 0.5
    output_per_mtok: 2.5
    cache_write_per_mtok: 0.625
    cache_write_1h_per_mtok: 1
    cache_read_per_mtok: 0.05
  source_url: https://platform.claude.com/docs/en/about-claude/pricing
  verified_on: "2026-10-22"
