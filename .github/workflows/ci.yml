name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        run: scripts/tools.sh actionlint d2
      - run: make lint

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: hashFiles('tests/**', 'pyproject.toml') != ''
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r requirements.txt
      - run: scripts/tools.sh gitleaks
      - run: make test

  scan-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: scripts/tools.sh terraform tofu tflint kubeconform trivy
      - run: python3 -m pip install -r requirements.txt -r requirements-scan.txt
      - run: scripts/scan.sh . out
      - name: Require an empty baseline
        run: python3 -c 'import json; assert json.load(open("out/normalized.json")) == []'

  eval-scanners:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: scripts/tools.sh terraform tofu tflint kubeconform trivy
      - run: python3 -m pip install -r requirements.txt -r requirements-scan.txt
      - run: python3 eval/run.py --scenarios all --out out/scanners-eval
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scanners-eval
          path: out/scanners-eval/
          if-no-files-found: error

  diagram:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        run: scripts/tools.sh d2
      - run: make diagram
      - name: Check PNG size and aspect
        run: python3 scripts/png_width.py docs/img/architecture.png --min 2400 --max 4000 --aspect-min 1.4 --aspect-max 2.0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: architecture
          path: docs/img/
          if-no-files-found: error
