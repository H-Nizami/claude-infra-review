notes: "Spec section 4.3 proposed changing identifier orders-db -> orders-primary. Checked hashicorp/aws v6.70.0: identifier is NOT ForceNew; the provider renames in place via ModifyDBInstance NewDBInstanceIdentifier (https://github.com/hashicorp/terraform-provider-aws/blob/v6.70.0/internal/service/rds/instance.go#L2603-L2605). The scenario instead changes username, which is ForceNew in the same schema (https://github.com/hashicorp/terraform-provider-aws/blob/v6.70.0/internal/service/rds/instance.go#L701-L707), so the plan destroys and recreates orders-db. Key written before the first scan run."
